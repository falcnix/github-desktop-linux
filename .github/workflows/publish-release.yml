name: Publish release

# Release flow:
#   1. Run "Build .deb" for an upstream tag; it uploads to a *draft* release
#      named after the app version (e.g. v3.7.0).
#   2. Review the draft, update the docs and checksums/, write the release
#      name into CURRENT_RELEASE and push. This workflow then publishes the
#      draft, creating the git tag at the pushed commit, and marks it as the
#      latest release (or a pre-release when the version contains a "-").
#
# Before publishing it checks that the .deb matches its .sha256 asset, that the
# draft was built from the current packaging scripts, and makes the SHA-256 in
# the release notes match the package.
#
# Re-running for an already published release only re-checks the assets and
# repairs the notes' checksum, so merging the branch that changed
# CURRENT_RELEASE is safe, and dispatching it for an old release fixes its
# notes.

on:
  push:
    branches: ['**']
    paths:
      - 'CURRENT_RELEASE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish or re-check (e.g. v3.7.0); defaults to CURRENT_RELEASE'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, to compare the packaging the draft was built from
          # with the packaging at this commit.
          fetch-depth: 0

      - name: Find the release
        id: rel
        env:
          # Passed through the environment rather than interpolated into the
          # script, so the input can never be interpreted as shell code.
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag="$(tr -d '[:space:]' < CURRENT_RELEASE)"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a release name like v3.7.0"; exit 1 ;;
          esac

          # Drafts have no git tag yet, so look them up by name.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)"
          if [ -z "$release_id" ]; then
            echo "::error::No release named $tag exists. Run the Build .deb workflow first."
            exit 1
          fi
          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)"
          echo "Release $tag (id $release_id), draft=$is_draft"
          {
            echo "tag=$tag"
            echo "id=$release_id"
            echo "draft=$is_draft"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the package against its checksum
        id: verify
        env:
          RELEASE_ID: ${{ steps.rel.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.id) \(.name)"' > assets/list.txt
          cat assets/list.txt
          deb_id="$(awk '$2 ~ /_amd64\.deb$/ {print $1; exit}' assets/list.txt)"
          deb_name="$(awk '$2 ~ /_amd64\.deb$/ {print $2; exit}' assets/list.txt)"
          sum_id="$(awk '$2 ~ /_amd64\.deb\.sha256$/ {print $1; exit}' assets/list.txt)"
          if [ -z "$deb_id" ] || [ -z "$sum_id" ]; then
            echo "::error::Release needs both a .deb and its .sha256 asset; refusing."
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$sum_id" > "assets/$deb_name.sha256"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$deb_id" > "assets/$deb_name"
          (cd assets && sha256sum -c "$deb_name.sha256")
          echo "sha256=$(cut -d' ' -f1 "assets/$deb_name.sha256")" >> "$GITHUB_OUTPUT"

      - name: Refuse a draft built from older packaging
        if: steps.rel.outputs.draft == 'true'
        env:
          RELEASE_ID: ${{ steps.rel.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > body.md
          built_from="$(sed -n 's/.*Packaged from [^@]*@\([0-9a-f]\{40\}\).*/\1/p' body.md | head -n 1)"
          if [ -z "$built_from" ]; then
            echo "::warning::Draft does not record which packaging commit built it; cannot check."
            exit 0
          fi
          echo "Draft was packaged from $built_from"
          if ! git cat-file -e "$built_from^{commit}" 2>/dev/null; then
            echo "::error::Packaging commit $built_from is not in this branch's history; rebuild the draft."
            exit 1
          fi
          if ! git diff --quiet "$built_from" "$GITHUB_SHA" -- \
               scripts packaging .github/workflows/build-deb.yml; then
            echo "::error::The packaging changed after this draft was built:"
            git diff --stat "$built_from" "$GITHUB_SHA" -- \
              scripts packaging .github/workflows/build-deb.yml
            echo "Run Build .deb again for this tag, then publish."
            exit 1
          fi

      - name: Make the release notes' SHA-256 match the package
        env:
          RELEASE_ID: ${{ steps.rel.outputs.id }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > body.md
          sed -E "s/(SHA-256: )[0-9a-f]{64}/\1${SHA256}/" body.md > fixed.md
          if cmp -s body.md fixed.md; then
            echo "Release notes already show $SHA256."
          else
            echo "Correcting the SHA-256 in the release notes:"
            diff body.md fixed.md || true
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F body=@fixed.md --jq '"Updated " + .html_url'
          fi

      - name: Publish the draft
        if: steps.rel.outputs.draft == 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          RELEASE_ID: ${{ steps.rel.outputs.id }}
        run: |
          set -euo pipefail
          # v3.6.6-beta1 is a pre-release; v3.6.5-deb2 (a packaging
          # re-release of a stable version) is not.
          app_version="${TAG#v}"
          app_version="$(sed -E 's/-deb[0-9]+$//' <<<"$app_version")"
          prerelease=false
          make_latest=true
          case "$app_version" in *-*) prerelease=true; make_latest=false ;; esac

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease="$prerelease" \
            -f target_commitish="$GITHUB_SHA" \
            -f make_latest="$make_latest" \
            --jq '"Published " + .html_url'
