name: Publish release

# Release flow:
#   1. Run "Build .deb" for an upstream tag; it uploads to a *draft* release
#      named after the app version (e.g. v3.6.5).
#   2. Review the draft, update the docs and checksums/, write the release
#      name into CURRENT_RELEASE and push. This workflow then publishes the
#      draft, creating the git tag at the pushed commit, and marks it as the
#      latest release (or a pre-release when the version contains a "-").
#
# Re-running for an already published release is a no-op, so merging the
# branch that changed CURRENT_RELEASE is safe.

on:
  push:
    branches: ['**']
    paths:
      - 'CURRENT_RELEASE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish (e.g. v3.6.5); defaults to CURRENT_RELEASE'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Publish the draft release
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(tr -d '[:space:]' < CURRENT_RELEASE)"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a release name like v3.6.5"; exit 1 ;;
          esac
          echo "Publishing $tag"

          # Drafts have no tag yet, so look them up by name.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)"
          if [ -z "$release_id" ]; then
            echo "::error::No release named $tag exists. Run the Build .deb workflow first."
            exit 1
          fi

          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)"
          if [ "$is_draft" != "true" ]; then
            echo "Release $tag is already published; nothing to do."
            exit 0
          fi

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name')"
          if ! grep -q '\.deb$' <<<"$assets"; then
            echo "::error::Draft $tag has no .deb asset; refusing to publish."
            exit 1
          fi

          prerelease=false
          make_latest=true
          case "$tag" in *-*) prerelease=true; make_latest=false ;; esac

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease="$prerelease" \
            -f target_commitish="$GITHUB_SHA" \
            -f make_latest="$make_latest" \
            --jq '"Published " + .html_url'
